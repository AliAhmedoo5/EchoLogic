name: Android CI & Release

on:
  push:
    branches: [ main, master, 001-fix-app-startup ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, 001-fix-app-startup ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        default: true
        type: boolean
      tag_name:
        description: 'Release Tag Name (optional, e.g. v1.0.1 - defaults to auto version)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APKs & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EchoLogic-APKs-${{ github.run_number }}
          path: |
            app/build/outputs/apk/**/*.apk

      - name: Create Release & Upload APKs
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number)) }}
          name: EchoLogic APKs (${{ inputs.tag_name != '' && inputs.tag_name || (github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number)) }})
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
